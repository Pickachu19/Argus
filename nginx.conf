user nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    map $http_x_request_id $request_id_to_forward {
        default $http_x_request_id;
        "" $request_id;
    }

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id_to_forward",'
                                '"remote_addr":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"latency":$request_time}';
    access_log /var/log/nginx/access.log json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Request-ID $request_id_to_forward always;

        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header Retry-After 60 always;
            return 429 "Too Many Requests\n";
        }

        location = /user/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://user-service:5000/login;
            proxy_set_header X-Forwarded-Prefix /user;
            proxy_set_header X-Request-ID $request_id_to_forward;
        }

        location = /user/register {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://user-service:5000/register;
            proxy_set_header X-Forwarded-Prefix /user;
            proxy_set_header X-Request-ID $request_id_to_forward;
        }

        location /user/ {
            proxy_pass http://user-service:5000/;
            proxy_set_header X-Forwarded-Prefix /user;
            proxy_set_header X-Request-ID $request_id_to_forward;
        }

        location = /api/products {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://product-service:5001/api/products;
            proxy_set_header X-Request-ID $request_id_to_forward;
        }

        location /product/ {
            proxy_pass http://product-service:5001/;
            proxy_set_header X-Forwarded-Prefix /product;
            proxy_set_header X-Request-ID $request_id_to_forward;
        }

        location / {
            proxy_pass http://product-service:5001;
            proxy_set_header X-Request-ID $request_id_to_forward;
        }
    }
}
