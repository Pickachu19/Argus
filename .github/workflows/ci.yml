name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      SECRET_KEY: ci-session-secret-at-least-32-characters
      JWT_SECRET_KEY: ci-jwt-secret-at-least-32-characters
      MONGO_URI: mongodb://localhost:27017/testdb
      USER_MONGO_URI: mongodb://localhost:27017/userdb
      COOKIE_SECURE: "false"
      UPLOAD_FOLDER: /tmp/product-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "${{ matrix.service }}/requirements.txt"}
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=55

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: secure-${{ matrix.service }}:ci
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: secure-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  integration:
    runs-on: ubuntu-latest
    needs: [test, images]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: sed -i 's/change-me-use-at-least-32-random-bytes/ci-session-secret-at-least-32-characters/' .env
      - run: sed -i 's/change-me-use-a-different-32-byte-random-value/ci-jwt-secret-at-least-32-characters/' .env
      - run: sed -i 's/change-me-with-a-long-random-password/ci-mongo-password-at-least-24-chars/' .env
      - run: sed -i 's/change-me-before-running-bootstrap/Admin-integration-password-123!/' .env
      - run: ./scripts/generate-dev-cert.sh
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm user-service python create_admin.py
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest requests beautifulsoup4
      - run: pytest tests/test_e2e.py -m integration
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
